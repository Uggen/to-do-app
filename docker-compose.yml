version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres-to-do-db
    environment:
      POSTGRES_DB: to_do_db
      POSTGRES_USER: to_do_db
      POSTGRES_PASSWORD: to_do_db1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U to_do_db"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  postgres_data:
    driver: local
